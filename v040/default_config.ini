# SysDVR-SD v0.4.0 example configuration
# The live file is created automatically at:
# sdmc:/switch/SysDVR-SD/config.ini
#
# 0 = unlimited segment length.
segment_minutes=30

# Stop/refuse recording when SD free space falls below this amount.
min_free_mib=512

# 1 = record Switch game audio, 0 = video only.
audio_enabled=1

# 0 = off, 1 = basic summary, 2 = detailed diagnostics.
diagnostics_level=1
