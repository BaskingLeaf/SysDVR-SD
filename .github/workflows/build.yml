name: Build SysDVR-SD Easy Install

on:
  workflow_dispatch:
  push:
    branches: [ v0.3.4-build ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:20260219
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore build project
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf work project.zip
          mkdir work
          cat payload/project.part.* | base64 -d > project.zip
          echo "2e28b36dbab4ce17afcc6ecf77e0991725eb965ab2d3eb6476894b422fd19427  project.zip" | sha256sum -c -
          unzip -t project.zip
          unzip -q project.zip -d work

      - name: Apply v0.3.4 writer and HOME-gap fixes
        shell: bash
        run: |
          set -euxo pipefail
          cp v032/main.c work/source/main.c
          cp v03/capture.c work/source/capture.c
          cp v032/config.h work/source/config.h

          # Keep the v0.3.3 writer throughput improvements.
          sed -i 's/#define WRITER_PRIORITY 45/#define WRITER_PRIORITY 43/' work/source/main.c
          sed -i 's/#define VIDEO_QUEUE_SLOTS 3u/#define VIDEO_QUEUE_SLOTS 5u/' work/source/config.h
          sed -i 's/#define AUDIO_QUEUE_SLOTS 16u/#define AUDIO_QUEUE_SLOTS 24u/' work/source/config.h
          sed -i 's/#define FLUSH_EVERY_BYTES (2u \* 1024u \* 1024u)/#define FLUSH_EVERY_BYTES (32u * 1024u * 1024u)/' work/source/config.h
          sed -i 's/uint8_t io_buffer\[64 \* 1024\];/uint8_t io_buffer[256 * 1024];/' work/source/mkv.h

          # Compact periods where Nintendo's gameplay capture stream disappears
          # (HOME/system UI), then resume on a clean IDR with audio held behind video.
          python3 v034/timeline_patch.py

          sed -i 's/v0.2 experimental/v0.3.4 home-gap/g; s/v0.2/v0.3.4/g' work/overlay/source/main.cpp

          grep SYSDVR_SD_VERSION work/source/config.h
          grep -E 'VIDEO_QUEUE_SLOTS|AUDIO_QUEUE_SLOTS|FLUSH_EVERY_BYTES|TIMELINE_GAP_THRESHOLD_US' work/source/config.h
          grep -E 'WRITER_PRIORITY|timeline_gaps|held_for_video_resync' work/source/main.c
          grep -E 'io_buffer' work/source/mkv.h

      - name: Build recorder sysmodule
        working-directory: work
        shell: bash
        run: |
          set -euxo pipefail
          make clean
          make -j"$(nproc)"
          test -s exefs.nsp

      - name: Fetch libtesla
        working-directory: work/overlay
        shell: bash
        run: |
          set -euxo pipefail
          git clone --no-checkout https://github.com/WerWolv/libtesla.git libtesla
          cd libtesla
          git checkout f766e9b607a05e9756843cbd62b3bfb98be1646c

      - name: Build Tesla overlay
        working-directory: work/overlay
        shell: bash
        run: |
          set -euxo pipefail
          make clean
          make -j"$(nproc)"
          test -s SysDVR-SD.ovl

      - name: Create SD-root install ZIP
        working-directory: work
        shell: bash
        run: |
          set -euxo pipefail
          make package
          mv SysDVR-SD.zip Switch-Recorder-Tesla-v0.3.4.zip
          unzip -t Switch-Recorder-Tesla-v0.3.4.zip
          unzip -l Switch-Recorder-Tesla-v0.3.4.zip | grep -F 'switch/.overlays/SysDVR-SD.ovl'
          unzip -l Switch-Recorder-Tesla-v0.3.4.zip | grep -F 'atmosphere/contents/00FF0000A53BB667/exefs.nsp'

      - name: Upload easy-install package
        uses: actions/upload-artifact@v4
        with:
          name: Switch-Recorder-Tesla-v0.3.4
          path: work/Switch-Recorder-Tesla-v0.3.4.zip
          if-no-files-found: error
          retention-days: 30
