name: Build SysDVR-SD Easy Install

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:20260219
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore build project
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf work project.zip
          mkdir work
          base64 -d project.b64 > project.zip
          unzip -q project.zip -d work
          ls -la work

      - name: Build sysmodule
        working-directory: work
        shell: bash
        run: |
          set -euxo pipefail
          make clean
          make -j"$(nproc)"
          test -s exefs.nsp

      - name: Create SD-root install ZIP
        working-directory: work
        shell: bash
        run: |
          set -euxo pipefail
          make package
          mv SysDVR-SD.zip SysDVR-SD-EasyInstall.zip
          unzip -l SysDVR-SD-EasyInstall.zip

      - name: Upload easy-install package
        uses: actions/upload-artifact@v4
        with:
          name: SysDVR-SD-EasyInstall
          path: work/SysDVR-SD-EasyInstall.zip
          if-no-files-found: error
          retention-days: 30
