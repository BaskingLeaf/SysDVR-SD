name: Build SysDVR-SD Overlay Easy Install

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:20260219
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore project
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf work
          mkdir work
          unzip -t project.zip
          unzip -q project.zip -d work

      - name: Fetch libtesla
        working-directory: work
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/WerWolv/libtesla.git overlay/libtesla

      - name: Build recorder sysmodule
        working-directory: work
        shell: bash
        run: |
          set -euxo pipefail
          make clean
          make -j"$(nproc)"
          test -s exefs.nsp

      - name: Build Tesla overlay
        working-directory: work/overlay
        shell: bash
        run: |
          set -euxo pipefail
          make clean
          make -j"$(nproc)"
          test -s SysDVR-SD.ovl

      - name: Package SD-root ZIP
        working-directory: work
        shell: bash
        run: |
          set -euxo pipefail
          make package
          mv SysDVR-SD.zip SysDVR-SD-Overlay-EasyInstall.zip
          unzip -l SysDVR-SD-Overlay-EasyInstall.zip
          test "$(unzip -Z1 SysDVR-SD-Overlay-EasyInstall.zip | grep -c '^switch/.overlays/SysDVR-SD.ovl$')" -eq 1
          test "$(unzip -Z1 SysDVR-SD-Overlay-EasyInstall.zip | grep -c '^atmosphere/contents/00FF0000A53BB667/exefs.nsp$')" -eq 1

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SysDVR-SD-Overlay-EasyInstall
          path: work/SysDVR-SD-Overlay-EasyInstall.zip
          if-no-files-found: error
          retention-days: 30
