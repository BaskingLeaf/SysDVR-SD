name: Build SysDVR-SD Easy Install

on:
  workflow_dispatch:
  push:
    branches: [ v0.4.1-build ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:20260219
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore build project
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf work project.zip
          mkdir work
          cat payload/project.part.* | base64 -d > project.zip
          echo "2e28b36dbab4ce17afcc6ecf77e0991725eb965ab2d3eb6476894b422fd19427  project.zip" | sha256sum -c -
          unzip -t project.zip
          unzip -q project.zip -d work

      - name: Apply stable v0.3.6 capture core
        shell: bash
        run: |
          set -euxo pipefail
          cp v032/main.c work/source/main.c
          cp v03/capture.c work/source/capture.c
          cp v032/config.h work/source/config.h

          sed -i 's/#define WRITER_PRIORITY 45/#define WRITER_PRIORITY 43/' work/source/main.c
          sed -i 's/#define VIDEO_QUEUE_SLOTS 3u/#define VIDEO_QUEUE_SLOTS 5u/' work/source/config.h
          sed -i 's/#define AUDIO_QUEUE_SLOTS 16u/#define AUDIO_QUEUE_SLOTS 24u/' work/source/config.h
          sed -i 's/#define FLUSH_EVERY_BYTES (2u \* 1024u \* 1024u)/#define FLUSH_EVERY_BYTES (32u * 1024u * 1024u)/' work/source/config.h
          sed -i 's/uint8_t io_buffer\[64 \* 1024\];/uint8_t io_buffer[256 * 1024];/' work/source/mkv.h
          python3 v036/shared_timeline_patch.py

      - name: Apply v0.4.0 configuration layer
        shell: bash
        run: |
          set -euxo pipefail
          cp v040/runtime_config.c work/source/runtime_config.c
          cp v040/runtime_config.h work/source/runtime_config.h
          cp v040/recorder.c work/source/recorder.c
          cp v040/default_config.ini work/default_config.ini
          python3 v040/app_patch.py

      - name: Apply v0.4.1 markers and live status
        shell: bash
        run: |
          set -euxo pipefail
          cp v041/overlay_main.cpp work/overlay/source/main.cpp
          python3 v041/features_patch.py

          grep SYSDVR_SD_VERSION work/source/config.h
          grep -E 'MARKER_REQUEST_FILE|STATUS_REQUEST_FILE|STATUS_FILE' work/source/config.h
          grep -E 'recorderAddMarker|recorderMarkerCount' work/source/recorder.c
          grep -E 'handle_marker_request|write_status_snapshot|markers_added' work/source/main.c
          grep -F 'v0.4.1' work/overlay/source/main.cpp
          grep -F 'Add marker' work/overlay/source/main.cpp
          grep -F 'Live health' work/overlay/source/main.cpp

      - name: Build recorder sysmodule
        working-directory: work
        shell: bash
        run: |
          set -euxo pipefail
          make clean
          make -j"$(nproc)"
          test -s exefs.nsp

      - name: Fetch libtesla
        working-directory: work/overlay
        shell: bash
        run: |
          set -euxo pipefail
          git clone --no-checkout https://github.com/WerWolv/libtesla.git libtesla
          cd libtesla
          git checkout f766e9b607a05e9756843cbd62b3bfb98be1646c

      - name: Build Tesla overlay
        working-directory: work/overlay
        shell: bash
        run: |
          set -euxo pipefail
          make clean
          make -j"$(nproc)"
          test -s SysDVR-SD.ovl

      - name: Create SD-root install ZIP
        working-directory: work
        shell: bash
        run: |
          set -euxo pipefail
          make package
          mv SysDVR-SD.zip Switch-Recorder-Tesla-v0.4.1.zip
          unzip -t Switch-Recorder-Tesla-v0.4.1.zip
          unzip -l Switch-Recorder-Tesla-v0.4.1.zip | grep -F 'switch/.overlays/SysDVR-SD.ovl'
          unzip -l Switch-Recorder-Tesla-v0.4.1.zip | grep -F 'atmosphere/contents/00FF0000A53BB667/exefs.nsp'
          unzip -l Switch-Recorder-Tesla-v0.4.1.zip | grep -F 'switch/SysDVR-SD/config.example.ini'

      - name: Upload easy-install package
        uses: actions/upload-artifact@v4
        with:
          name: Switch-Recorder-Tesla-v0.4.1
          path: work/Switch-Recorder-Tesla-v0.4.1.zip
          if-no-files-found: error
          retention-days: 30
